[project]
name = "pvechallenge"
version = "0.1.0"
description = "Prepare un lobby de partie personnalisee League of Legends via l'API locale du client (LCU)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["requests>=2.31"]

[project.gui-scripts]
pvechallenge = "pvechallenge.gui:main"

[dependency-groups]
dev = ["nuitka", "pillow", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pvechallenge"]
