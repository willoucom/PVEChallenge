[project]
name = "lolbot"
version = "0.1.0"
description = "Prepare un lobby de partie personnalisee League of Legends via l'API locale du client (LCU)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["requests>=2.31"]

[project.scripts]
lolbot = "lolbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lolbot"]
