name: release

# A `v*` tag publishes the executable in the matching Release.
# The manual trigger builds without publishing: it exists to check that the
# build still holds, without having to create a tag to find out.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Test before building: a green binary beats a delivered one.
      # The interface tests open real Tk windows, kept off-screen; the Windows
      # runner has a desktop session, unlike a Linux runner where they would be
      # skipped.
      - name: Run the tests
        run: uv run python -m pytest

      # The runner carries MSVC: Nuitka has no compiler to download.
      #
      # On a tag, the tag decides the version stamped into the binary: it is what
      # a user downloads, so it is what the file must announce. A manual run has
      # no tag, and the variable stays empty so the build falls back to
      # pyproject.toml.
      - name: Build the executable
        env:
          PVECHALLENGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: uv run python build.py

      # Inno Setup turns that folder into the single file people download. The
      # tag decides its name too, so a Release lists an installer that says which
      # version it carries. A manual run builds it as well: an installer that
      # only ever gets compiled on a tag would break on the day it matters.
      - name: Build the installer
        env:
          PVECHALLENGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: uv run python make_installer.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pvechallenge
          path: dist/pvechallenge
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pvechallenge-setup
          path: dist/*-setup.exe
          if-no-files-found: error

      # The zip is the portable alternative to the installer, for whoever wants
      # the application without installing it. A Release cannot carry a folder as
      # such, hence the archive. The workflow artifact needs no such treatment:
      # GitHub already serves artifacts as zips.
      - name: Package the application
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >
          Compress-Archive
          -Path dist/pvechallenge
          -DestinationPath dist/pvechallenge-${{ github.ref_name }}.zip

      # Creating a Release that already exists is an error, which would break a
      # re-run from the Actions page, or a tag pushed again after its Release was
      # deleted. Uploading over an existing one keeps the step repeatable.
      - name: Publish to the Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          installer="dist/pvechallenge-${tag}-setup.exe"
          archive="dist/pvechallenge-${tag}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" "$archive" --clobber
          else
            gh release create "$tag" "$installer" "$archive" --generate-notes
          fi
